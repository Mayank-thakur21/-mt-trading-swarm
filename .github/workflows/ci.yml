name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Starting a new run cancels an older one still running for the same branch or PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install ruff (version pinned in requirements-dev.txt)
        run: python -m pip install "$(grep -E '^ruff==' requirements-dev.txt)"

      - name: ruff check
        run: ruff check --output-format=github .

      - name: ruff format --check
        run: ruff format --check --diff .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      # The suite never touches the network (synthetic market data, fake LLM and SMTP
      # clients); these make sure nothing could fall through to a real provider.
      DATA_PROVIDER: synthetic
      LLM_PROVIDER: none
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: pytest with coverage
        run: >-
          python -m pytest -q
          --cov=trading_swarm --cov=dashboard --cov=scripts
          --cov-report=term --cov-report=xml
          --cov-fail-under=85

      - name: Upload coverage report
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14

  docker:
    name: Docker images (api, dashboard)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build api target
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          tags: mt-trading-swarm-api:ci
          load: true
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build dashboard target
        uses: docker/build-push-action@v6
        with:
          context: .
          target: dashboard
          tags: mt-trading-swarm-dashboard:ci
          load: true
          push: false
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,scope=dashboard,mode=max

      - name: Smoke test (containers start and report healthy)
        run: |
          set -euo pipefail
          docker network create swarm-ci
          docker run -d --name api --network swarm-ci -p 8000:8000 \
            -e DATA_PROVIDER=synthetic -e LLM_PROVIDER=none mt-trading-swarm-api:ci
          docker run -d --name dashboard --network swarm-ci -p 8501:8501 \
            -e API_URL=http://api:8000 mt-trading-swarm-dashboard:ci

          wait_for() {  # url, name
            for _ in $(seq 1 30); do
              if curl -fsS "$1" > /dev/null; then echo "$2 is up"; return 0; fi
              sleep 2
            done
            echo "::error::$2 did not become healthy"; docker logs "$2"; return 1
          }
          wait_for http://127.0.0.1:8000/health api
          wait_for http://127.0.0.1:8501/_stcore/health dashboard
          curl -fsS http://127.0.0.1:8000/health
          echo
          # The image must run as the unprivileged app user, never root.
          test "$(docker exec api id -u)" = "10001"
          test "$(docker exec dashboard id -u)" = "10001"

      - name: Container logs
        if: always()
        run: |
          docker logs api || true
          docker logs dashboard || true
