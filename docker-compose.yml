version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

  dashboard:
    build: .
    ports:
      - "8501:8501"
    command: streamlit run dashboard.py --server.port=8501 --server.address=0.0.0.0
    depends_on:
      - api
    environment:
      - API_URL=http://api:8000
    restart: unless-stopped
